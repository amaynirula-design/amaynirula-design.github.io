<header class="site-header">
  <div class="site-header__top">
    <a class="wordmark" href="{{ '/' | relative_url }}" aria-label="Amay Nirula, home">
      <span class="wordmark__name">Amay Nirula</span>
      <span class="wordmark__role">Product · Engineering</span>
    </a>
    <button class="theme-toggle" id="theme-toggle" type="button" hidden aria-label="Switch to dark theme" aria-pressed="false">
      <span class="theme-toggle__symbol" aria-hidden="true">◐</span>
      <span class="theme-toggle__label">Dark mode</span>
    </button>
  </div>
  <nav class="site-nav" aria-label="Main navigation">
    {% for item in site.navigation %}
      <a class="site-nav__link" href="{{ item.url | relative_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.title | escape }}</a>
    {% endfor %}
  </nav>
</header>
